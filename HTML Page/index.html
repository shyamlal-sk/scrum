<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        h1 {
            color: #4a5568;
            text-align: center;
            margin-bottom: 30px;
        }
        .content {
            line-height: 1.6;
            margin-bottom: 40px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        input {
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        button {
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .primary {
            background: #48bb78;
            color: white;
        }
        .primary:hover {
            background: #38a169;
            transform: translateY(-2px);
        }
        .secondary {
            background: #4299e1;
            color: white;
        }
        .secondary:hover {
            background: #3182ce;
            transform: translateY(-2px);
        }
        .danger {
            background: #f56565;
            color: white;
        }
        .danger:hover {
            background: #e53e3e;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome</h1>
        
        <div class="content">
            <form>
                <input type="text" placeholder="Username" required>
                <input type="email" placeholder="Email Address" required>
                <input type="password" placeholder="Password" required>
            </form>
        </div>
        
        <div class="buttons">
            <button class="primary" onclick="alert('Signed up successfully! 🎉')">Sign Up</button>
            <button class="secondary" onclick="alert('Redirecting to login... 🔐')">Log In</button>
            <button class="danger" onclick="location.reload()">Reset</button>
        </div>
    </div>

    <script>
        console.log('Welcome page loaded successfully!');
    </script>
</body>
</html>
